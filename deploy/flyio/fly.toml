app = "prospercode-ai"
primary_region = "gru"

[build]
  dockerfile = "../docker/Dockerfile.backend"

[env]
  PORT = "8000"
  DATABASE_URL = "${DATABASE_URL}"
  REDIS_URL = "${REDIS_URL}"
  OPENAI_API_KEY = "${OPENAI_API_KEY}"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static"