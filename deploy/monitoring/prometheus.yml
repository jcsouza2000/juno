global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'juno-backend'
    static_configs:
      - targets: ['juno-backend-prod:8000']
    metrics_path: '/metrics'

  - job_name: 'juno-kong'
    static_configs:
      - targets: ['juno-kong-prod:8001']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
