version: '3.8'

services:
  bentoml:
    image: python:3.11-slim
    container_name: juno-bentoml
    command: >
      bash -c "pip install bentoml scikit-learn pandas numpy &&
               bentoml serve --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - bentoml_models:/root/bentoml
    environment:
      BENTOML_HOME: /root/bentoml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bentoml_models:
