[pytest]
minversion = 8.0
testpaths = app/tests app/ontology/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --basetemp=.pytest_tmp
    --ignore=app/tests/test_ml.py
    --ignore=app/tests/test_reports.py
    --ignore=app/tests/test_security.py
markers =
    slow: testes lentos
    integration: requer infra externa
# Silenciar deprecation warnings de libs terceiras (visivel quando atualizam).
# Filtros por padrao de mensagem (nao por modulo) para nao falhar se a lib
# nao estiver instalada no ambiente atual de testes.
filterwarnings =
    ignore:.*RequestsDependencyWarning.*
    ignore:.*PyparsingDeprecationWarning.*
    ignore:.*python_multipart.*:PendingDeprecationWarning
    ignore:.*datetime.datetime.utcnow.*is deprecated.*:DeprecationWarning
    ignore:.*declarative_base.*function is now available.*:DeprecationWarning
    ignore:.*PydanticDeprecatedSince20.*
    ignore:.*Support for class-based.*config.*is deprecated.*:DeprecationWarning
    ignore:.*ast.NameConstant is deprecated.*:DeprecationWarning
    ignore:.*PyType_Spec with a metaclass.*:DeprecationWarning
