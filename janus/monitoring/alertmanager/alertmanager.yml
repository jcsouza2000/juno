global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@juno.ai'
  smtp_auth_username: 'alerts@juno.ai'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 30m
      continue: true
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 1m
      repeat_interval: 2h
    - match:
        service: database
      receiver: 'dba-team'
      group_wait: 30s
    - match_re:
        service: api|gateway
      receiver: 'sre-team'
      group_wait: 15s

receivers:
  - name: 'default'
    email_configs:
      - to: 'oncall@juno.ai'
        send_resolved: true
        headers:
          Subject: 'JUNO Alert: {{ .GroupLabels.alertname }}'

  - name: 'sre-team'
    slack_configs:
      - channel: '#sre-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SRE_KEY}'
        severity: warning
        description: '{{ .GroupLabels.alertname }}'

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_CRITICAL_KEY}'
        severity: critical
        description: '{{ .GroupLabels.alertname }}: {{ .Annotations.summary }}'

  - name: 'slack-warnings'
    slack_configs:
      - channel: '#warnings'
        send_resolved: true
        title: 'Warning: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'dba-team'
    email_configs:
      - to: 'dba@juno.ai'
        send_resolved: true
    slack_configs:
      - channel: '#dba-alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
