upstream backend_servers {
    least_conn;
    server backend:8000 max_fails=3 fail_timeout=30s;
}

upstream frontend_servers {
    server frontend:80 max_fails=3 fail_timeout=30s;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://\System.Management.Automation.Internal.Host.InternalHost\;
    }
}

# HTTPS — API
server {
    listen 443 ssl http2;
    server_name api.juno.local;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:;" always;

    # API rate limiting
    location /api/v1/auth/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://backend_servers;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend_servers;
        include /etc/nginx/proxy_params;
    }

    # Health check (no rate limit)
    location /api/v1/health {
        proxy_pass http://backend_servers;
        include /etc/nginx/proxy_params;
        access_log off;
    }
}

# HTTPS — Frontend
server {
    listen 443 ssl http2;
    server_name app.juno.local;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://frontend_servers;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://backend_servers;
        include /etc/nginx/proxy_params;
    }
}
