name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend core (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: janus/backend
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: janus/backend/requirements*.txt

      - name: Install core deps + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Format check (black, non-blocking)
        run: black --check app/ || true

      - name: Type check (mypy, blocking)
        run: mypy app/

      - name: Security scan (bandit, non-blocking)
        run: bandit -r app/ -ll || true

      - name: AI eval (offline — playbook/coverage)
        env:
          PYTHONPATH: .
          JUNO_ENV: development
          SECRET_KEY: ci-test-secret-key-must-have-at-least-32-chars-xxx
          ENCRYPTION_KEY: N6zYqfBC2CxUgdztuLcM5nVSyxe7S6TjzS-ZmrkcmCM=
          DATABASE_URL: sqlite:///./ci-eval.db
        run: pytest app/tests/test_ai_eval.py app/tests/test_ai_playbook.py -q --no-cov

      - name: Tests with coverage
        env:
          PYTHONPATH: .
          JUNO_ENV: development
          SECRET_KEY: ci-test-secret-key-must-have-at-least-32-chars-xxx
          ENCRYPTION_KEY: N6zYqfBC2CxUgdztuLcM5nVSyxe7S6TjzS-ZmrkcmCM=
          DATABASE_URL: sqlite:///./ci.db
        run: pytest

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: janus/backend/htmlcov/
          retention-days: 7

  backend-ml:
    name: Backend ML (requirements-ml.txt)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: janus/backend
    # Job pesado — só roda em main/develop (não em PR rápido).
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: janus/backend/requirements*.txt

      - name: Install core + ML deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install pytest pytest-cov httpx

      - name: Smoke import dos módulos ML
        env:
          PYTHONPATH: .
          JUNO_ENV: development
          SECRET_KEY: ci-test-secret-key-must-have-at-least-32-chars-xxx
          ENCRYPTION_KEY: N6zYqfBC2CxUgdztuLcM5nVSyxe7S6TjzS-ZmrkcmCM=
          DATABASE_URL: sqlite:///./ci-ml.db
        run: |
          python -c "
          import os
          os.environ.setdefault('SECRET_KEY', 'x'*64)
          os.environ.setdefault('DATABASE_URL', 'sqlite:///./ci-ml.db')
          from app.main import app
          # Conta routers carregados
          paths = [r.path for r in app.routes]
          print(f'Total rotas: {len(paths)}')
          assert any('/api/v1/ai' in p for p in paths), 'Router AI não carregou'
          print('OK')
          "

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: janus/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: janus/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deps-scan:
    name: Dependency CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend, non-blocking)
        working-directory: janus/backend
        run: |
          python -m pip install --upgrade pip pip-audit
          # Auditoria de CVEs nas deps pinadas. Non-blocking ate triarmos o baseline;
          # tornar bloqueante (remover '|| true') apos zerar/aceitar os achados.
          pip-audit -r requirements.txt --desc on || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend, non-blocking)
        working-directory: janus/frontend
        run: npm audit --audit-level=high || true

  audit-ledger:
    name: Audit ledger (juno_audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install juno_audit (+ api/test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./juno_audit[api,test]"

      - name: Ledger tests (asserts no nivel de modulo, offline — OTS mockado)
        working-directory: juno_audit
        run: |
          set -e
          for f in test_smoke.py test_anchor.py test_ots_offline.py test_router.py test_sprint3.py; do
            echo "== $f =="
            python "$f"
          done

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect hardcoded secrets
        run: |
          # Falha se SECRET_KEY hardcoded reaparecer
          if grep -rn "juno-dev-secret-key-change-in-production" . \
               --include="*.py" --exclude-dir=.venv --exclude-dir=node_modules; then
            echo "::error::SECRET_KEY hardcoded detectada"
            exit 1
          fi
          # Falha se DB credentials reaparecerem
          if grep -rn "juno_dev_2026" . \
               --include="*.py" --exclude-dir=.venv --exclude-dir=node_modules; then
            echo "::error::credenciais de DB hardcoded detectadas"
            exit 1
          fi
          echo "OK — sem secrets conhecidos no código"
