[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juno-audit"
version = "0.3.0"
description = "JUNO_AI - Camada de Confianca (Ledger + Agent ID + Export)"
requires-python = ">=3.11"
dependencies = [
  "pynacl>=1.5",
  "sqlalchemy>=2.0",
  "apscheduler>=3.11",
  "opentimestamps==0.4.5",
]

[project.optional-dependencies]
api  = ["fastapi>=0.110", "pydantic>=2"]
test = ["httpx>=0.27"]

[project.scripts]
juno-verify = "juno_audit.verify:main"
juno-anchor = "juno_audit.scheduler:_main"

[tool.setuptools.packages.find]
include = ["juno_audit*"]
